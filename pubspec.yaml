
name: saferoute_lk
description: SafeRouteLK - Community Safety App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  geolocator: ^13.0.2

  # Bluetooth Beacon
  flutter_blue_plus: ^1.36.8

  # Bluetooth Alert Sound
  audioplayers: ^6.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/saferoute_data.json
    - assets/sounds/alert.mp3
